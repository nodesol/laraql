name: run-tests

# Run the test suite on every push, every pull request and on demand.
# There are intentionally no path filters, so any change (tests, workbench,
# workflows, docs, ...) always runs the suite.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede queued runs for the same branch so repeated pushes do not pile up.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-lowest, prefer-stable]
        # The suite boots a workbench application, so the Testbench major has to
        # match the Laravel major it is paired with. The prefer-lowest legs install
        # the lowest allowed version of every dependency and then restore only the
        # test harness, see the "Install dependencies" step below.
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
        exclude:
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Pin the Laravel and Testbench versions under test
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies (lowest)
        if: matrix.stability == 'prefer-lowest'
        run: |
          composer update --prefer-lowest --prefer-dist --no-interaction --no-scripts
          composer update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" pestphp/pest pestphp/pest-plugin-laravel pestphp/pest-plugin-arch --with-all-dependencies --prefer-dist --no-interaction
        # The first command installs the lowest allowed version of every dependency.
        # Its scripts are skipped because --prefer-lowest also downgrades the test
        # harness, and the oldest patches of Testbench (9.0.0 / 10.0.0) cannot run a
        # workbench based suite at all: 9.0.0 fails to boot the application
        # ("Target class [cache.store] does not exist") and 10.0.0 with Laravel 12.0.x
        # blows up in the migrator ("Undefined property: stdClass::$migration" in
        # Migrator::hasRunAnyMigrations()). Both failures come from vendor code and are
        # fixed in later patches of the same major.
        #
        # The second command restores the harness and the Pest tooling to the newest
        # stable release of the requested majors, so the dependencies this package
        # actually declares - nuwave/lighthouse, spatie/laravel-package-tools and
        # mll-lab/graphql-php-scalars - stay on their lowest allowed version.

      - name: Install dependencies (stable)
        if: matrix.stability != 'prefer-lowest'
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage --min=100
